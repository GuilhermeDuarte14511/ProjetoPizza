  <style>
    :root{--red:#a83300;--orange:#d94f16;--cream:#fff8f3;--ink:#211713;--muted:#755d54;--line:#e9cfc5;--green:#157347;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--cream)}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #4db7e5;outline-offset:3px}.hidden{display:none!important}
    .screen{min-height:100vh}.primary,.secondary{min-height:54px;border-radius:14px;padding:13px 22px;font-weight:800;transition:.2s transform,.2s box-shadow}.primary{border:0;background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;box-shadow:0 12px 28px #5c1a0733}.secondary{border:2px solid #a48275;background:#fff;color:#51382f}.primary:hover,.secondary:hover{transform:translateY(-2px)}
    .idle{position:relative;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;padding:28px 5vw 20px;background:linear-gradient(115deg,#23110ac9,#531e0870),url('../src/ProjetoPizza.Web/src/assets/hero.png') center/112%;color:#fff;animation:kenburns 18s ease-in-out infinite alternate;isolation:isolate}.idle:after{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 45%,transparent 5%,#16070299 100%);content:""}.idle header,.idle footer{z-index:2;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900}.logo{display:grid;width:44px;height:44px;place-items:center;border-radius:50%;background:var(--orange);box-shadow:0 8px 20px #26080055}.pill{border:1px solid #ffffff77;border-radius:999px;padding:10px 16px;background:#35140766;font-size:13px;font-weight:800;backdrop-filter:blur(10px)}
    .idle-content{z-index:2;display:grid;width:min(780px,94vw);place-items:center;align-self:center;justify-self:center;text-align:center}.idle h1{max-width:760px;margin:12px 0;font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.055em;text-wrap:balance;text-shadow:0 8px 28px #0008}.idle p{max-width:600px;margin:0;color:#fff4ed;font-size:19px;line-height:1.55}.eyebrow{color:#ffd4bf;font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.idle .primary{min-width:310px;margin-top:30px}.pizza-orbit{position:relative;display:grid;width:170px;height:170px;margin-bottom:18px;place-items:center}.pizza-orbit b{display:grid;width:126px;height:126px;place-items:center;border:2px solid #ffd7c0aa;border-radius:50%;background:radial-gradient(circle,#dd591e,#7b2104);box-shadow:0 0 0 14px #fff1,0 0 60px #ff713977;font-size:64px;animation:float 4s ease-in-out infinite}.pizza-orbit i{position:absolute;width:11px;height:11px;border-radius:50%;background:#ffb078;box-shadow:0 0 15px #ff7139;animation:orbit 6s linear infinite}.pizza-orbit i:nth-child(3){width:7px;height:7px;animation-delay:-2s;animation-duration:4.7s}.pizza-orbit i:nth-child(4){width:6px;height:6px;animation-delay:-4s;animation-duration:7.2s}.sparks{position:absolute;inset:0;z-index:1;pointer-events:none}.sparks i,.confetti i{position:absolute;bottom:-10px;left:calc(5% + var(--i)*7.5%);width:4px;height:4px;border-radius:50%;background:#ffc09c;box-shadow:0 0 10px #ff7b39;animation:spark calc(5s + var(--i)*.2s) linear infinite;animation-delay:calc(var(--i)*-.5s)}.idle footer{color:#ffffffbb;font-size:12px}.link-button{border:0;background:transparent;color:inherit;text-decoration:underline}

    .panel{max-width:920px;margin:auto;padding:42px 24px}.panel-head{text-align:center}.panel-head h1{margin:8px 0;font-size:42px}.panel-head p{color:var(--muted)}.cart-list{display:grid;gap:14px;margin:30px 0}.cart-row{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:18px;border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.cart-row>span{font-size:42px}.summary{display:grid;gap:12px;border:1px solid var(--line);border-radius:20px;padding:24px;background:#fff}.line{display:flex;justify-content:space-between}.total{border-top:1px solid var(--line);padding-top:16px;color:var(--red);font-size:25px;font-weight:900}.summary .primary{margin-top:8px}
    .tracking{display:grid;min-height:calc(100vh - 80px);place-items:center;padding:30px}.tracking-card{width:min(760px,94vw);border:1px solid var(--line);border-radius:28px;padding:40px;background:#fff;text-align:center;box-shadow:0 20px 55px #5424151e}.success{display:grid;width:96px;height:96px;margin:0 auto 20px;place-items:center;border-radius:50%;background:#d9f3e5;color:var(--green);font-size:50px;animation:pop .55s}.steps{display:grid;grid-template-columns:repeat(3,1fr);margin:35px 0}.step{position:relative;display:grid;gap:8px;color:#9a877f}.step:before{position:absolute;top:18px;right:50%;left:-50%;height:3px;background:#e9ddd8;content:""}.step:first-child:before{display:none}.step b{z-index:1;display:grid;width:38px;height:38px;margin:auto;place-items:center;border-radius:50%;background:#e9ddd8}.step.active{color:var(--green);font-weight:800}.step.active b,.step.active:before{background:var(--green);color:#fff}.tracking-card .primary{margin-top:10px}
    .thank{position:relative;display:grid;place-items:center;overflow:hidden;padding:20px;background:linear-gradient(#2228,#2228),url('../src/ProjetoPizza.Web/src/assets/hero.png') center/cover}.thank-card{z-index:2;display:grid;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;justify-items:center;border:1px solid var(--line);border-radius:24px;padding:30px 40px;background:#fff;text-align:center;box-shadow:0 28px 80px #17070277;animation:thankin .7s cubic-bezier(.16,.85,.25,1.08)}.check{display:grid;width:78px;height:78px;place-items:center;border-radius:50%;background:var(--red);color:#fff;font-size:43px;box-shadow:0 10px 25px #a8330055;animation:pop .7s}.thank h1{margin:14px 0 8px;color:var(--red);font-size:42px}.thank .lead{margin:0 0 18px;color:var(--muted);font-size:18px}.thank-info{width:100%;border-radius:14px;padding:16px;background:#f7f1ed}.social{display:flex;align-items:center;gap:36px;margin-top:20px}.social>div{display:grid;justify-items:center;gap:8px}.social small{font-weight:800;text-transform:uppercase}.divider{width:1px;height:80px;background:var(--line)}.qr{position:relative;width:108px;height:108px;border:8px solid #fff;border-radius:8px;background:repeating-linear-gradient(90deg,#321e18 0 5px,transparent 5px 10px),repeating-linear-gradient(#321e18 0 5px,#fff 5px 10px);box-shadow:0 0 0 1px var(--line)}.qr i{position:absolute;width:28px;height:28px;border:6px solid #321e18;background:#fff}.qr i:nth-child(1){top:4px;left:4px}.qr i:nth-child(2){top:4px;right:4px}.qr i:nth-child(3){bottom:4px;left:4px}.instagram{display:grid;width:58px;height:58px;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--red);font-size:27px;font-weight:900;text-decoration:none}.countdown{display:flex;align-items:center;gap:12px;margin-top:18px;color:var(--muted)}.ring{display:grid;width:50px;height:50px;place-items:center;border-radius:50%;background:conic-gradient(var(--red) calc(var(--progress)*1%),#f0ded7 0);font-weight:900}.ring:before{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:#fff;content:attr(data-time)}.thank .secondary{min-height:44px;margin-top:14px}.confetti{position:absolute;inset:0;z-index:1;pointer-events:none}.confetti i{top:-20px;bottom:auto;left:calc(2% + var(--i)*4.1%);width:9px;height:17px;border-radius:2px;background:#f6a21a;box-shadow:none;animation:fall calc(4s + var(--i)*.1s) linear infinite;animation-delay:calc(var(--i)*-.2s)}.confetti i:nth-child(3n){background:#d7440b}.confetti i:nth-child(4n){background:#5c9f68;border-radius:50%}
    @keyframes kenburns{to{background-position:56% 52%;background-size:120%}}@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}@keyframes orbit{to{transform:rotate(360deg) translateX(82px) rotate(-360deg)}}@keyframes spark{0%{opacity:0}12%{opacity:.9}to{opacity:0;transform:translateY(-105vh) translateX(40px)}}@keyframes cardin{from{opacity:0;transform:translateY(20px) scale(.97)}}@keyframes thankin{from{opacity:0;transform:translateY(28px) scale(.95)}}@keyframes pop{from{opacity:0;transform:scale(.45) rotate(-12deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
    @media(max-width:760px){.idle{padding:18px;background-size:cover}.idle h1{font-size:42px}.idle footer span{display:none}.guest-card{padding:26px 18px}.guest-card h1{font-size:32px}.guest-actions{flex-direction:column-reverse}.topbar{padding:10px 14px}.topbar nav button:not(.cart){display:none}.content{padding:18px}.menu-hero{grid-template-columns:1fr}.menu-photo{min-height:190px}.menu-hero>div{padding:26px}.menu-hero h1{font-size:36px}.products{grid-template-columns:1fr}.steps{font-size:12px}.thank-card{padding:26px 18px}.social{gap:18px}.divider{display:none}}

    /* Idle v2: forno contemporâneo */
    .idle-content{width:min(1180px,96vw);place-items:initial;text-align:left}.idle-stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);align-items:center;gap:clamp(30px,7vw,96px)}.idle-copy{display:grid;justify-items:start}.idle-copy h1{max-width:680px;font-size:clamp(48px,6.2vw,84px)}.idle-copy p{max-width:560px}.idle-copy .primary{margin-top:30px}.highlights{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.highlights span{border:1px solid #ffffff33;border-radius:999px;padding:8px 12px;background:#200c055c;color:#ffffffe0;font-size:12px;font-weight:800;backdrop-filter:blur(10px)}.oven{position:relative;display:grid;width:min(410px,100%);min-height:470px;justify-self:center;align-content:center;justify-items:center;overflow:hidden;border:1px solid #ffdcc545;border-radius:210px 210px 38px 38px;padding:48px 34px 28px;background:linear-gradient(145deg,#461a0bdc,#180803eb);box-shadow:inset 0 1px #ffffff22,0 35px 80px #0a03016b;backdrop-filter:blur(16px)}.oven:before{position:absolute;inset:10px;border:1px solid #ffb17e21;border-radius:inherit;content:""}.oven-sign{z-index:2;margin-bottom:24px;color:#ffd5ba;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.oven-mouth{position:relative;display:grid;width:290px;height:248px;place-items:center;overflow:hidden;border:9px solid #793518e6;border-bottom-width:16px;border-radius:150px 150px 30px 30px;background:radial-gradient(circle at 50% 82%,#ffb23e 0 8%,#eb591b 28%,#6f1907 61%,#170603 82%);box-shadow:inset 0 0 42px #120300,0 0 46px #e14d1152}.oven-glow{position:absolute;right:15%;bottom:7%;left:15%;height:60%;border-radius:50%;background:radial-gradient(ellipse at bottom,#ffd86ae0,#f5531561 42%,transparent 72%);filter:blur(5px);animation:fire 2.4s ease-in-out infinite alternate}.oven-pizza{z-index:2;display:grid;width:132px;height:132px;margin-top:48px;place-items:center;border:9px solid #d28a43;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8c95f 0     @media(max-width:900px){.idle-stage{grid-template-columns:minmax(0,1fr) 300px;gap:24px}.oven{min-height:390px;padding-inline:22px}.oven-mouth{width:230px;height:195px}.oven-pizza{width:104px;height:104px;font-size:42px}}
    @media(max-width:760px){.idle-content{place-items:center;text-align:center}.idle-stage{grid-template-columns:1fr}.idle-copy{justify-items:center}.idle-copy h1{font-size:46px}.oven{display:none}.highlights{justify-content:center}}

    /* Referência vigente: designs/telaIdle */
    .design-idle{padding:20px 32px 32px;background:linear-gradient(180deg,#0c05029e 0%,#0c050229 43%,#080301cc 100%),url('../src/ProjetoPizza.Web/src/assets/tablet-idle-pizzeria.jpg') center/cover;color:#fff;animation:designpan 18s ease-in-out infinite alternate}.design-idle:after{background:linear-gradient(180deg,#0c05023b,#0803018f)}.design-idle header{align-self:start}.design-badge,.design-actions button{display:inline-flex;min-height:52px;align-items:center;gap:10px;border:1px solid #e1bfb5e6;border-radius:999px;padding:10px 18px;background:#fff8f3eb;color:#59413a;box-shadow:0 8px 24px #220c0529;font-size:14px;font-weight:800;backdrop-filter:blur(14px)}.design-badge b{color:var(--red);font-size:19px}.design-actions{display:flex;gap:9px}.design-actions button{width:52px;justify-content:center;padding:0}.design-idle .idle-content{width:100%;place-items:center;padding:12px 24px 24px;text-align:center}.design-center{display:grid;justify-items:center}.design-center h1{margin:0;color:#fff;font-size:clamp(56px,6vw,78px);font-weight:900;line-height:.95;letter-spacing:-.055em;text-shadow:0 7px 24px #0008}.design-center h1 span{color:#ffcfbf}.design-center small{margin-top:13px;color:#ffd9cc;font-weight:800;letter-spacing:.19em;text-transform:uppercase}.design-center p{max-width:720px;margin-top:25px;color:#fff;font-size:clamp(24px,2.7vw,34px);font-weight:700;line-height:1.2;text-shadow:0 4px 18px #000a}.design-center .primary{min-width:min(420px,88vw);min-height:80px;margin-top:34px;border:2px solid #cf5423;border-radius:16px;background:#b83d0e;font-size:20px;animation:designpulse 2.5s ease-in-out infinite}.design-promo{z-index:2;display:grid;width:min(880px,calc(100vw - 64px));grid-template-columns:76px 1fr auto;align-items:center;gap:18px;align-self:end;justify-self:center;border:1px solid #e1bfb5c7;border-radius:17px;padding:14px 20px;background:#fff8f3db;color:#33211b;box-shadow:0 15px 38px #12060242;backdrop-filter:blur(18px)}.design-promo img{width:76px;height:76px;border-radius:10px;object-fit:cover}.design-promo div{display:grid;justify-items:start;text-align:left}.design-promo em{border-radius:5px;padding:4px 8px;background:#268451;color:#fff;font-size:10px;font-style:normal;font-weight:800;text-transform:uppercase}.design-promo strong{margin-top:5px;font-size:18px}.design-promo p{margin:2px 0 0;color:#65483f;font-size:14px}.design-dots{display:flex;gap:8px}.design-dots i{width:8px;height:8px;border-radius:50%;background:#d7dae2}.design-dots i:first-child{background:var(--red)}@keyframes designpan{to{background-position:53% 48%}}@keyframes designpulse{50%{transform:scale(1.018);box-shadow:0 0 0 12px #cc491600}}

<body>
  <div id="root"></div>
  <script>
    const root=document.querySelector('#root');let state='idle',guests=2,cart=[],seconds=20,timer;
    const products=[['Margherita','Molho artesanal, muçarela fresca e manjericão.',49.9,'🍕'],['Calabresa','Muçarela, calabresa artesanal e cebola roxa.',54.9,'🍕'],['Quatro Queijos','Muçarela, provolone, gorgonzola e parmesão.',59.9,'🧀']];
    const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const sparks=n=>Array.from({length:n},(_,i)=>`<i style="--i:${i}"></i>`).join('');
    function render(){clearInterval(timer);if(state==='idle')idle();if(state==='menu')menu();if(state==='cart')cartView();if(state==='tracking')tracking();if(state==='thank')thank();}
    function idle(){root.innerHTML=`<main class="screen idle design-idle"><div class="sparks">${sparks(16)}</div><header><span class="design-badge"><b>♨</b> Mesa 12</span><div class="design-actions"><span class="design-badge"><b style="color:#187b48">⌁</b> Conexão ativa</span><button onclick="alert('Na aplicação real, essa ação revoga o token após confirmação.')" aria-label="Desvincular este tablet">↪</button></div></header><section class="idle-content" id="idleContent"><div class="design-center"><h1>FORNO <span>27</span></h1><small>Pizzeria Artigianale</small><p>A verdadeira pizza artesanal espera por você</p><button class="primary" onclick="chooseGuests()">Toque para iniciar seu pedido &nbsp;☝</button></div></section><aside class="design-promo"><img src="../src/ProjetoPizza.Web/src/assets/tablet-idle-pizzeria.jpg" alt="Pizza artesanal saindo do forno"><div><em>Sugestão do chef</em><strong>Margherita Especial</strong><p>Molho pelati, mozzarella di bufala e manjericão fresco.</p></div><span class="design-dots"><i></i><i></i><i></i></span></aside></main>`}
    function chooseGuests(){document.querySelector('.design-promo')?.remove();document.querySelector('#idleContent').innerHTML=`<div class="guest-card"><span class="eyebrow" style="color:var(--red)">Nova comanda</span><h1>Quantas pessoas estão na mesa?</h1><p>Essa informação ajuda nossa equipe a preparar um atendimento melhor.</p><div class="counter"><button onclick="changeGuests(-1)" aria-label="Diminuir">−</button><output><strong id="guestValue">${guests}</strong><small id="guestLabel">pessoas</small></output><button onclick="changeGuests(1)" aria-label="Aumentar">+</button></div><div class="guest-actions"><button class="secondary" onclick="render()">Voltar</button><button class="primary" onclick="startOrder()">Confirmar e ver cardápio</button></div></div>`}
    function changeGuests(n){guests=Math.max(1,Math.min(50,guests+n));document.querySelector('#guestValue').textContent=guests;document.querySelector('#guestLabel').textContent=guests===1?'pessoa':'pessoas'}
    function startOrder(){state='menu';render()}
    function menu(){root.innerHTML=`<main class="screen app"><header class="topbar"><span class="brand"><i class="logo">△</i> Forno 27</span><span class="pill">Mesa 12 · ${guests} pessoas</span><nav><button>Meus pedidos</button><button>Chamar garçom</button><button class="cart" onclick="openCart()">Carrinho · <b id="cartCount">${cart.length}</b></button></nav></header><div class="content"><section class="menu-hero"><div><span class="eyebrow" style="color:var(--red)">Feita no forno a lenha</span><h1>Monte sua noite do seu jeito.</h1><p>Escolha seus sabores favoritos. Nesta POC, adicione pizzas e siga até a confirmação.</p><button class="primary" onclick="add(0)">Adicionar Margherita</button></div><div class="menu-photo"></div></section><h2 class="section-title">Mais pedidos hoje</h2><section class="products">${products.map((p,i)=>`<article class="product"><div class="photo">${p[3]}</div><div><h2>${p[0]}</h2><p>${p[1]}</p><footer><strong>${money(p[2])}</strong><button onclick="add(${i})">Adicionar</button></footer></div></article>`).join('')}</section></div></main>`}
    function add(i){cart.push(products[i]);document.querySelector('#cartCount').textContent=cart.length;toast(`${products[i][0]} adicionada ao carrinho`)}
    function toast(text){const old=document.querySelector('.toast');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">✓ ${text}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),1800)}
    function openCart(){if(!cart.length){toast('Adicione pelo menos uma pizza');return}state='cart';render()}
    function cartView(){const total=cart.reduce((s,p)=>s+p[2],0);root.innerHTML=`<main class="screen app"><header class="topbar"><span class="brand"><i class="logo">△</i> Forno 27</span><button class="secondary" onclick="state='menu';render()">← Voltar ao cardápio</button></header><section class="panel"><div class="panel-head"><span class="eyebrow" style="color:var(--red)">Sua comanda</span><h1>Revise seu pedido</h1><p>Os preços e a disponibilidade serão validados pelo servidor.</p></div><div class="cart-list">${cart.map((p,i)=>`<article class="cart-row"><span>${p[3]}</span><div><strong>${p[0]}</strong><p>${p[1]}</p></div><strong>${money(p[2])}</strong></article>`).join('')}</div><aside class="summary"><div class="line"><span>Subtotal</span><strong>${money(total)}</strong></div><div class="line"><span>Taxa de serviço (10%)</span><strong>${money(total*.1)}</strong></div><div class="line total"><span>Total</span><strong>${money(total*1.1)}</strong></div><button class="primary" onclick="submitOrder()">Enviar pedido para a cozinha</button></aside></section></main>`}
    function submitOrder(){state='tracking';render()}
    function tracking(){root.innerHTML=`<main class="screen app"><header class="topbar"><span class="brand"><i class="logo">△</i> Forno 27</span><span class="pill">Pedido #1042</span></header><section class="tracking"><article class="tracking-card"><span class="success">✓</span><span class="eyebrow" style="color:var(--green)">Pedido recebido</span><h1>Já estamos preparando tudo!</h1><p>Na aplicação real, esta linha evolui com o estado da cozinha.</p><div class="steps"><span class="step active"><b>✓</b>Recebido</span><span class="step active"><b>2</b>Em preparo</span><span class="step"><b>3</b>Pronto</span></div><button class="primary" onclick="finishDemo()">Simular entrega, conta e pagamento</button></article></section></main>`}
    function finishDemo(){state='thank';seconds=20;render()}
    function thank(){root.innerHTML=`<main class="screen thank"><div class="confetti">${sparks(24)}</div><section class="thank-card"><span class="check">✓</span><h1>Obrigado pela visita!</h1><p class="lead">Foi muito bom ter você à mesa. Volte sempre!</p><div class="thank-info">Pagamento confirmado. Até a próxima!</div><div class="social"><div><small>Avalie-nos no Google</small><div class="qr" title="QR demonstrativo"><i></i><i></i><i></i></div></div><span class="divider"></span><div><small>Siga-nos no Instagram</small><a class="instagram" href="#" onclick="event.preventDefault();alert('Aqui será aberta a URL configurada do Instagram.')">@</a></div></div><div class="countdown"><span class="ring" id="ring" data-time="20" style="--progress:100"></span><span>A tela inicial voltará automaticamente</span></div><button class="secondary" onclick="backToIdle()">Preparar para o próximo atendimento</button></section></main>`;timer=setInterval(()=>{seconds--;const ring=document.querySelector('#ring');if(!ring)return;ring.dataset.time=seconds;ring.style.setProperty('--progress',seconds*5);if(seconds<=0)backToIdle()},1000)}
    function backToIdle(){clearInterval(timer);state='idle';cart=[];guests=2;render()}render();
  </script>
</body>
</html>
