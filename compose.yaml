services:
  postgres:
    image: postgres:17-alpine
    container_name: projeto-pizza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projeto_pizza}
      POSTGRES_USER: ${POSTGRES_USER:-projeto_pizza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - projeto_pizza_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - projeto-pizza

  api:
    profiles: ["client"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: projeto-pizza-api:local
    container_name: projeto-pizza-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "*"
      ConnectionStrings__PostgreSql: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-projeto_pizza};Username=${POSTGRES_USER:-projeto_pizza};Password=${POSTGRES_PASSWORD}"
      Authentication__SigningKey: ${Authentication__SigningKey:?Defina Authentication__SigningKey}
      DevelopmentSeed__AdminPassword: ${DevelopmentSeed__AdminPassword:?Defina DevelopmentSeed__AdminPassword}
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost:8080}
      Cors__AllowedOrigins__1: ${LOCAL_APP_ORIGIN:-http://localhost:8080}
      Cors__AllowedOrigins__2: ${LOOPBACK_APP_ORIGIN:-http://127.0.0.1:8080}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - projeto-pizza

  web:
    profiles: ["client"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: /backend
    image: projeto-pizza-web:local
    container_name: projeto-pizza-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - projeto-pizza

volumes:
  projeto_pizza_postgres_data:
    name: projeto-pizza-postgres-data

networks:
  projeto-pizza:
    name: projeto-pizza-network
