<script>
        // Shader initialization
        const vertexShader = `
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const fragmentShader = `
            precision highp float;
            varying vec2 v_texCoord;
            uniform float u_time;
            uniform vec2 u_resolution;

            float noise(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            float snoise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float a = noise(i);
                float b = noise(i + vec2(1.0, 0.0));
                float c = noise(i + vec2(0.0, 1.0));
                float d = noise(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            void main() {
                vec2 uv = v_texCoord;
                
                // Warm fire colors based on the Forno 27 palette (#e85d2a and darker tones)
                vec3 color1 = vec3(0.91, 0.36, 0.16); // #e85d2a
                vec3 color2 = vec3(0.4, 0.1, 0.0);   // Darker red/brown
                vec3 color3 = vec3(1.0, 0.7, 0.2);   // Golden highlight
                
                // Create animated heat distortion/ember flow
                float n = snoise(uv * 3.0 + vec2(0.0, -u_time * 0.4));
                n += 0.5 * snoise(uv * 6.0 + vec2(u_time * 0.1, -u_time * 0.6));
                
                // Vignette and bottom glow
                float glow = smoothstep(1.0, 0.0, uv.y) * 0.5;
                float dist = distance(uv, vec2(0.5, 0.0));
                float heat = smoothstep(0.8, 0.0, dist) * n;
                
                vec3 finalColor = mix(color2, color1, heat);
                finalColor = mix(finalColor, color3, heat * heat);
                
                // Apply a soft dark overlay to keep UI text readable
                float overlay = 0.6 + 0.4 * smoothstep(0.0, 1.0, uv.y);
                
                gl_FragColor = vec4(finalColor * glow * overlay, heat * 0.4);
            }
        `;

        function initShader() {
            const container = document.getElementById('shader-container');
            const renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            const geometry = new THREE.PlaneGeometry(2, 2);
            const uniforms = {
                u_time: { value: 1.0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            function animate(time) {
                requestAnimationFrame(animate);
                uniforms.u_time.value = time * 0.001;
                renderer.render(scene, camera);
            }

            requestAnimationFrame(animate);

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            });
        }

        window.addEventListener('load', initShader);
    </script>
